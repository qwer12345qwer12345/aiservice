name: Flutter CD

on:
  push:
    branches: [ main ]

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Inject official llama.cpp source (Latest)
        run: |
          PLUGIN_DIR=$(find ~/.pub-cache -type d -name "flutter_llama-*" | head -n 1)
          if [ -d "$PLUGIN_DIR" ] && [ ! -f "$PLUGIN_DIR/llama.cpp/include/llama.h" ]; then
            echo "Cloning latest llama.cpp..."
            git clone https://github.com/ggml-org/llama.cpp.git /tmp/llama_cpp_repo
            rm -rf "$PLUGIN_DIR/llama.cpp"
            mv /tmp/llama_cpp_repo "$PLUGIN_DIR/llama.cpp"
            echo "Latest llama.cpp injected successfully."
          fi
      - name: Install glslc for Vulkan shaders
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-*.apk

  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Inject official llama.cpp source (Latest)
        run: |
          PLUGIN_DIR=$(find ~/.pub-cache -type d -name "flutter_llama-*" | head -n 1)
          if [ -d "$PLUGIN_DIR" ] && [ ! -f "$PLUGIN_DIR/llama.cpp/include/llama.h" ]; then
            echo "Cloning latest llama.cpp..."
            git clone https://github.com/ggml-org/llama.cpp.git /tmp/llama_cpp_repo
            rm -rf "$PLUGIN_DIR/llama.cpp"
            mv /tmp/llama_cpp_repo "$PLUGIN_DIR/llama.cpp"
            echo "Latest llama.cpp injected successfully."
          fi
      - run: flutter build ipa --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/ios/ipa/*.ipa

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build\windows-app.zip

  release:
    needs: [build_android, build_ios, build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android
          path: android
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: ios
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ai service
          files: |
            android/*.apk
            ios/*.ipa
            windows/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
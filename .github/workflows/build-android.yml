name: Build Flutter Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ★★★ 核心：预装 NDK + Vulkan 全家桶 + 三重降维打击绕过 Linker ★★★
      - name: Pre-install NDK & Inject Vulkan & Triple Bypass
        run: |
          echo "🚀 Step 1: Pre-installing NDK 27 & CMake 3.22.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          
          echo "🔍 Step 2: Locating flutter_llama plugin..."
          PLUGIN_DIR=$(find $HOME/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          if [ -z "$PLUGIN_DIR" ]; then
            echo "❌ Fatal: Could not find flutter_llama plugin directory."
            exit 1
          fi
          cd "$PLUGIN_DIR"
          
          echo "🛠️ Step 3: Patching CMake version..."
          GRADLE_FILE=""
          if [ -f "android/build.gradle.kts" ]; then GRADLE_FILE="android/build.gradle.kts"
          elif [ -f "android/build.gradle" ]; then GRADLE_FILE="android/build.gradle"; fi
          
          if [ -n "$GRADLE_FILE" ]; then
            sed -i 's/"3.18.1"/"3.22.1"/g' "$GRADLE_FILE"
            sed -i "s/'3.18.1'/'3.22.1'/g" "$GRADLE_FILE"
          fi
          
          echo "🚀 Step 4: Shallow cloning llama.cpp..."
          rm -rf llama.cpp
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/ggerganov/llama.cpp.git
          
          echo "💉 Step 5: Injecting Version-Pinned Vulkan Dependencies into NDK 27 Sysroot..."
          SYSROOT="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          mkdir -p $SYSROOT/usr/include/vulkan
          mkdir -p $SYSROOT/usr/include/vk_video
          
          rm -rf SPIRV-Headers
          git clone --depth 1 --branch main https://github.com/KhronosGroup/SPIRV-Headers.git
          cd SPIRV-Headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=$SYSROOT/usr
          cmake --build build --target install
          cd ..
          
          VULKAN_TAG="v1.3.290"
          rm -rf Vulkan-Headers
          git clone --depth 1 --branch $VULKAN_TAG https://github.com/KhronosGroup/Vulkan-Headers.git
          cp -r Vulkan-Headers/include/vulkan/* $SYSROOT/usr/include/vulkan/
          cp -r Vulkan-Headers/include/vk_video/* $SYSROOT/usr/include/vk_video/
          
          rm -rf Vulkan-Hpp
          git clone --depth 1 --branch $VULKAN_TAG https://github.com/KhronosGroup/Vulkan-Hpp.git
          HPP_FILE=$(find Vulkan-Hpp -type f -name "vulkan.hpp" | head -n 1)
          VULKAN_HPP_DIR=$(dirname "$HPP_FILE")
          cp -r "$VULKAN_HPP_DIR"/* $SYSROOT/usr/include/vulkan/
          
          echo "💥 Step 6: CMake Safe Injection (Force API 28 & Ignore Linker Errors)..."
          CMAKE_FILE="android/src/main/cpp/CMakeLists.txt"
          if [ -f "$CMAKE_FILE" ]; then
            # 使用 cat 确保安全写入，避免 sed 换行符解析错误
            cat << 'EOF' > temp_cmake_patch.txt
# [CI OVERRIDE] Force Vulkan 1.1 API Level & Bypass Linker Errors
set(ANDROID_PLATFORM "android-28" CACHE STRING "Force Vulkan 1.1 API" FORCE)
set(CMAKE_SYSTEM_VERSION 28 CACHE STRING "Force Vulkan 1.1 API" FORCE)
set(ANDROID_NATIVE_API_LEVEL 28 CACHE STRING "Force Vulkan 1.1 API" FORCE)
add_link_options(-Wl,--unresolved-symbols=ignore-all)
EOF
            cat temp_cmake_patch.txt "$CMAKE_FILE" > temp_cmake_new.txt
            mv temp_cmake_new.txt "$CMAKE_FILE"
            rm temp_cmake_patch.txt
            echo "✅ CMake forced to use API 28 Sysroot and ignore undefined Vulkan symbols."
          fi
          
          echo "🧹 Step 7: Cleaning all CMake caches..."
          rm -rf android/.cxx
          rm -rf $HOME/.pub-cache/hosted/pub.dev/flutter_llama-*/android/.cxx
          rm -rf $GITHUB_WORKSPACE/android/.cxx
          rm -rf $GITHUB_WORKSPACE/build/flutter_llama/intermediates/cxx
          
          echo "🛡️ Step 8: Applying Global Gradle minSdk Override (Subprojects)..."
          cd $GITHUB_WORKSPACE
          # 强制覆写 Groovy 语法
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

// [CI OVERRIDE] Force minSdk 28 for all modules (Vulkan 1.1)
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (project.android.hasProperty('defaultConfig')) {
                    project.android.defaultConfig {
                        minSdkVersion 28
                    }
                }
            }
        }
    }
}
EOF
          fi
          # 强制覆写 Kotlin DSL 语法
          if [ -f "android/build.gradle.kts" ]; then
            cat << 'EOF' >> android/build.gradle.kts

// [CI OVERRIDE] Force minSdk 28 for all modules (Vulkan 1.1)
subprojects {
    afterEvaluate {
        if (hasProperty("android")) {
            extensions.configure<com.android.build.gradle.BaseExtension>("android") {
                defaultConfig {
                    minSdk = 28
                }
            }
        }
    }
}
EOF
          fi
          
          echo "🛡️ Step 9: Applying Flutter Official Kotlin Legacy Flags..."
          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            grep -qxF "android.builtInKotlin=false" "$GRADLE_PROPS" || echo "android.builtInKotlin=false" >> "$GRADLE_PROPS"
            grep -qxF "android.newDsl=false" "$GRADLE_PROPS" || echo "android.newDsl=false" >> "$GRADLE_PROPS"
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
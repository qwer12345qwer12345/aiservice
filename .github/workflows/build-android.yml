name: Build Flutter Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4

      # 2. 安装 Vulkan 着色器编译工具 (glslc)
      - name: Install Vulkan build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc

      # 3. 设置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ★★★ 核心反思与重构：融入 NDK 沙箱 + 精准替换版本 ★★★
      - name: Ultimate NDK Sysroot Injection & Version Patch
        run: |
          echo "🔍 Searching for flutter_llama plugin directory..."
          PLUGIN_DIR=$(find $HOME/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          
          if [ -z "$PLUGIN_DIR" ]; then
            PLUGIN_DIR=$(find $HOME/.pub-cache -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$PLUGIN_DIR" ]; then
            echo "❌ Fatal: Could not find flutter_llama plugin directory."
            exit 1
          fi
          
          echo "✅ Plugin directory found: $PLUGIN_DIR"
          cd "$PLUGIN_DIR"
          
          # --- 修复 1: 精准替换 CMake 版本 (不删除，而是替换为预装的 3.22.1) ---
          GRADLE_FILE=""
          if [ -f "android/build.gradle.kts" ]; then
            GRADLE_FILE="android/build.gradle.kts"
          elif [ -f "android/build.gradle" ]; then
            GRADLE_FILE="android/build.gradle"
          fi
          
          if [ -n "$GRADLE_FILE" ]; then
            echo "🛠️ Replacing CMake 3.18.1 with 3.22.1 in $GRADLE_FILE..."
            sed -i 's/"3.18.1"/"3.22.1"/g' "$GRADLE_FILE"
            sed -i "s/'3.18.1'/'3.22.1'/g" "$GRADLE_FILE"
          fi
          
          # --- 修复 2: 极速克隆 llama.cpp ---
          rm -rf llama.cpp
          echo "🚀 Shallow cloning llama.cpp..."
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/ggerganov/llama.cpp.git
          
          # --- 修复 3: 降维打击 - 将 SPIRV-Headers 直接安装到 NDK Sysroot ---
          echo "🛠️ Downloading SPIRV-Headers..."
          rm -rf SPIRV-Headers
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          cd SPIRV-Headers
          
          # 推导 NDK 路径
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -n 1)
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="/usr/local/lib/android/sdk/ndk/27.0.12077973" # fallback
          fi
          SYSROOT="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          
          echo "🚀 Installing SPIRV-Headers directly into NDK Sysroot: $SYSROOT"
          # 核心：直接安装到 sysroot/usr，CMake 在 NDK 环境下会自动将其视为 Android 系统原生库！
          cmake -B build -DCMAKE_INSTALL_PREFIX=$SYSROOT/usr
          cmake --build build --target install
          cd ..
          
          # --- 修复 4: 清理 Gradle CMake 缓存，强制重新配置 ---
          cd $GITHUB_WORKSPACE
          echo "🧹 Cleaning Gradle .cxx cache to force CMake reconfiguration..."
          rm -rf android/.cxx
          rm -rf android/app/.cxx
          
          # --- 修复 5: 开启 Kotlin Legacy 兼容模式 ---
          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            echo "🛠️ Applying Built-in Kotlin migration flags..."
            grep -qxF "android.builtInKotlin=false" "$GRADLE_PROPS" || echo "android.builtInKotlin=false" >> "$GRADLE_PROPS"
            grep -qxF "android.newDsl=false" "$GRADLE_PROPS" || echo "android.newDsl=false" >> "$GRADLE_PROPS"
          fi

      # 5. 构建 Android APK
      - name: Build Android APK
        run: flutter build apk --release

      # 6. 上传构建产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
name: Build Flutter Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 设置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. 设置 Flutter 环境
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ★★★ 核心步骤：在插件目录中克隆 llama.cpp ★★★
      - name: Provide llama.cpp inside flutter_llama plugin
        run: |
          PLUGIN_DIR=$(find $HOME/.pub-cache/hosted -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          if [ -z "$PLUGIN_DIR" ]; then
            echo "Primary path failed. Trying alternative search..."
            PLUGIN_DIR=$(find / -type d -name "flutter_llama-*" 2>/dev/null | grep pub | head -n 1)
          fi
          if [ -z "$PLUGIN_DIR" ]; then
            echo "❌ Failed to find flutter_llama plugin directory"
            exit 1
          fi
          echo "✅ Plugin directory found: $PLUGIN_DIR"
          cd "$PLUGIN_DIR"
          rm -rf llama.cpp
          git clone https://github.com/ggerganov/llama.cpp.git
          if [ -f "llama.cpp/include/llama.h" ]; then
            echo "✅ llama.h successfully placed in plugin directory"
          else
            echo "❌ Failed to place llama.h"
            exit 1
          fi

      # ★★★ 新增修复：安装插件强制要求的 CMake 3.18.1 ★★★
      - name: Install CMake 3.18.1
        run: |
          echo "Installing CMake 3.18.1 required by flutter_llama..."
          # 动态查找 sdkmanager 路径以兼容不同的 Runner 镜像版本
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          # 接受许可并安装指定的 CMake 版本
          yes | $SDKMANAGER "cmake;3.18.1"

      # 3. 构建 Android APK
      - name: Build Android APK
        run: flutter build apk --release

      # 4. 上传构建产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
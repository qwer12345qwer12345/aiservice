name: Build Flutter Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ★★★ 1. 缓存 CMake 3.18.1 (解决安装慢的问题) ★★★
      - name: Cache Android CMake 3.18.1
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/cmake/3.18.1
          key: android-cmake-3.18.1-${{ runner.os }}

      # ★★★ 2. 仅在无缓存时安装 3.18.1 ★★★
      - name: Install CMake 3.18.1 (if not cached)
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          echo "🛠️ Cache miss. Installing CMake 3.18.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.18.1"
          echo "✅ CMake 3.18.1 installed and cached."

      # ★★★ 3. 克隆 llama.cpp 并 Hack 它的版本要求 (解决版本死锁) ★★★
      - name: Provide llama.cpp & Hack CMake Requirement
        run: |
          PLUGIN_DIR=$(find $HOME/.pub-cache/hosted -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          if [ -z "$PLUGIN_DIR" ]; then
            PLUGIN_DIR=$(find / -type d -name "flutter_llama-*" 2>/dev/null | grep pub | head -n 1)
          fi
          
          if [ -z "$PLUGIN_DIR" ]; then
            echo "❌ Failed to find flutter_llama plugin directory"
            exit 1
          fi
          
          echo "✅ Plugin directory found: $PLUGIN_DIR"
          cd "$PLUGIN_DIR"
          
          rm -rf llama.cpp
          
          # 浅克隆，极速下载
          echo "🚀 Shallow cloning llama.cpp..."
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git
          
          # 核心 Hack：强行将 llama.cpp 的 CMake 最低版本要求降级为 3.18
          # 这会匹配并替换所有 CMakeLists.txt 中的 cmake_minimum_required(VERSION x.xx)
          echo "🛠️ Hacking llama.cpp to accept CMake 3.18.1..."
          find llama.cpp -name "CMakeLists.txt" -exec sed -i -E 's/cmake_minimum_required[[:space:]]*\([[:space:]]*VERSION[[:space:]]*[0-9.]+/cmake_minimum_required(VERSION 3.18/g' {} +
          echo "✅ llama.cpp CMake requirement downgraded to 3.18."

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
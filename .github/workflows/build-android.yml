name: Build Flutter Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4

      # 2. 安装 Vulkan 着色器编译工具 (glslc 是 llama.cpp 编译 Vulkan 必需的)
      - name: Install Vulkan build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc

      # 3. 设置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ★★★ 核心步骤：终极 Patch (解除限制 + 物理注入 Vulkan + Kotlin 兼容) ★★★
      - name: Ultimate Patch for flutter_llama & Vulkan & Kotlin
        run: |
          echo "🔍 Searching for flutter_llama plugin directory..."
          PLUGIN_DIR=$(find $HOME/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          
          if [ -z "$PLUGIN_DIR" ]; then
            PLUGIN_DIR=$(find $HOME/.pub-cache -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$PLUGIN_DIR" ]; then
            echo "❌ Fatal: Could not find flutter_llama plugin directory."
            exit 1
          fi
          
          echo "✅ Plugin directory found: $PLUGIN_DIR"
          cd "$PLUGIN_DIR"
          
          # --- 修复 1: 解除 CMake 3.18.1 限制 ---
          GRADLE_FILE=""
          if [ -f "android/build.gradle.kts" ]; then
            GRADLE_FILE="android/build.gradle.kts"
          elif [ -f "android/build.gradle" ]; then
            GRADLE_FILE="android/build.gradle"
          fi
          
          if [ -n "$GRADLE_FILE" ]; then
            echo "🛠️ Removing CMake 3.18.1 restriction in $GRADLE_FILE..."
            perl -i -ne 'print unless /3\.18\.1/' "$GRADLE_FILE"
          fi
          
          # --- 修复 2: 极速克隆 llama.cpp ---
          rm -rf llama.cpp
          echo "🚀 Shallow cloning llama.cpp..."
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/ggerganov/llama.cpp.git
          
          # --- 修复 3: 下载 SPIRV-Headers 源码并物理注入 (绕过 NDK 沙箱) ---
          echo "🛠️ Downloading SPIRV-Headers source code..."
          rm -rf SPIRV-Headers
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          
          # 获取绝对路径
          SPIRV_INCLUDE_DIR=$(pwd)/SPIRV-Headers/include
          echo "✅ SPIRV-Headers include dir: $SPIRV_INCLUDE_DIR"
          
          # 找到 llama.cpp 中 Vulkan 的 CMakeLists.txt
          VULKAN_CMAKE=$(find llama.cpp -type f -name "CMakeLists.txt" | grep -i vulkan | head -n 1)
          
          if [ -n "$VULKAN_CMAKE" ]; then
            echo "🛠️ Patching $VULKAN_CMAKE to bypass find_package..."
            # 1. 注释掉 find_package，让 CMake 不再去系统里找 Config 文件
            sed -i 's/find_package(SPIRV-Headers/# find_package(SPIRV-Headers/g' "$VULKAN_CMAKE"
            # 2. 在文件第一行强行注入 include 目录，物理指定头文件位置
            sed -i "1i include_directories(\"$SPIRV_INCLUDE_DIR\")" "$VULKAN_CMAKE"
            echo "✅ Vulkan CMake patched successfully. NDK sysroot restriction bypassed."
          else
            echo "⚠️ Warning: Could not find Vulkan CMakeLists.txt in llama.cpp."
          fi
          
          # --- 修复 4: 根据 Flutter 官方指南，配置 Kotlin Legacy 兼容模式 ---
          cd $GITHUB_WORKSPACE
          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            echo "🛠️ Applying Built-in Kotlin migration flags (Legacy mode)..."
            # 按照官方文档，添加这两个 flag 以兼容未迁移的旧插件 (如 flutter_llama)
            grep -qxF "android.builtInKotlin=false" "$GRADLE_PROPS" || echo "android.builtInKotlin=false" >> "$GRADLE_PROPS"
            grep -qxF "android.newDsl=false" "$GRADLE_PROPS" || echo "android.newDsl=false" >> "$GRADLE_PROPS"
            echo "✅ Kotlin Legacy mode enabled. Warnings suppressed."
          fi

      # 5. 构建 Android APK
      - name: Build Android APK
        run: flutter build apk --release

      # 6. 上传构建产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
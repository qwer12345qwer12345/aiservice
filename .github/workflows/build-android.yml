name: Build Flutter Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 设置 Java 环境 (Flutter 3.16+ 及现代 Android Gradle 插件需要 JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. 设置 Flutter 环境
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ★★★ 核心优化 1：缓存 CMake 3.18.1 目录 ★★★
      - name: Cache Android CMake 3.18.1
        id: cache-cmake
        uses: actions/cache@v4
        with:
          # GitHub Actions ubuntu-latest 的默认 ANDROID_HOME 绝对路径
          path: /usr/local/lib/android/sdk/cmake/3.18.1
          key: android-cmake-3.18.1-${{ runner.os }}

      # ★★★ 核心优化 2：仅在缓存未命中时执行安装 ★★★
      - name: Install CMake 3.18.1 (if not cached)
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          echo "🛠️ Cache miss. Installing CMake 3.18.1 via sdkmanager..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.18.1"
          echo "✅ CMake 3.18.1 installed. It will be cached for future runs."

      # ★★★ 核心优化 3：克隆 llama.cpp (加入浅克隆优化) ★★★
      - name: Provide llama.cpp inside flutter_llama plugin
        run: |
          PLUGIN_DIR=$(find $HOME/.pub-cache/hosted -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          
          if [ -z "$PLUGIN_DIR" ]; then
            echo "Primary path failed. Trying alternative search..."
            PLUGIN_DIR=$(find / -type d -name "flutter_llama-*" 2>/dev/null | grep pub | head -n 1)
          fi
          
          if [ -z "$PLUGIN_DIR" ]; then
            echo "❌ Failed to find flutter_llama plugin directory"
            exit 1
          fi
          
          echo "✅ Plugin directory found: $PLUGIN_DIR"
          cd "$PLUGIN_DIR"
          
          rm -rf llama.cpp
          
          # 使用 --depth 1 进行浅克隆，跳过下载庞大的 Git 历史记录
          echo "🚀 Shallow cloning llama.cpp..."
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git
          
          if [ -f "llama.cpp/include/llama.h" ]; then
            echo "✅ llama.h successfully placed in plugin directory"
          else
            echo "❌ Failed to place llama.h"
            exit 1
          fi

      # 3. 构建 Android APK (Release 模式)
      - name: Build Android APK
        run: flutter build apk --release

      # 4. 上传构建产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
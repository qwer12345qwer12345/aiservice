name: Build Flutter Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 安装 Vulkan 着色器编译器
      - name: Install Vulkan build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ★★★ 核心：预装 NDK + 注入 SPIRV-Headers + 注入 Vulkan-Hpp ★★★
      - name: Pre-install NDK & Inject All Vulkan Dependencies into Sysroot
        run: |
          echo "🚀 Step 1: Pre-installing NDK 27 & CMake 3.22.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          
          echo "🔍 Step 2: Locating flutter_llama plugin..."
          PLUGIN_DIR=$(find $HOME/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          if [ -z "$PLUGIN_DIR" ]; then
            echo "❌ Fatal: Could not find flutter_llama plugin directory."
            exit 1
          fi
          cd "$PLUGIN_DIR"
          
          echo "🛠️ Step 3: Patching CMake version restriction (3.18.1 -> 3.22.1)..."
          GRADLE_FILE=""
          if [ -f "android/build.gradle.kts" ]; then GRADLE_FILE="android/build.gradle.kts"
          elif [ -f "android/build.gradle" ]; then GRADLE_FILE="android/build.gradle"; fi
          
          if [ -n "$GRADLE_FILE" ]; then
            sed -i 's/"3.18.1"/"3.22.1"/g' "$GRADLE_FILE"
            sed -i "s/'3.18.1'/'3.22.1'/g" "$GRADLE_FILE"
          fi
          
          echo "🚀 Step 4: Shallow cloning llama.cpp..."
          rm -rf llama.cpp
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/ggerganov/llama.cpp.git
          
          echo "💉 Step 5: Injecting SPIRV-Headers & Vulkan-Hpp into NDK 27 Sysroot..."
          SYSROOT="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          
          # 1. 安装 SPIRV-Headers (CMake Config) - 解决之前的 find_package 报错
          rm -rf SPIRV-Headers
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          cd SPIRV-Headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=$SYSROOT/usr
          cmake --build build --target install
          cd ..
          
          # 2. 注入 Vulkan-Hpp (提供 vulkan/vulkan.hpp C++ bindings) - 解决当前的 fatal error
          rm -rf Vulkan-Hpp
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Hpp.git
          # 将 C++ 头文件直接合并到 NDK 的系统 include 目录中
          cp -r Vulkan-Hpp/include/* $SYSROOT/usr/include/
          # 兼容不同版本的仓库结构
          if [ -d "Vulkan-Hpp/Vulkan-Headers/include" ]; then
              cp -r Vulkan-Hpp/Vulkan-Headers/include/* $SYSROOT/usr/include/
          fi
          echo "✅ Vulkan-Hpp (vulkan.hpp) successfully injected into Sysroot."
          
          echo "🧹 Step 6: Cleaning all CMake caches..."
          rm -rf android/.cxx
          rm -rf $HOME/.pub-cache/hosted/pub.dev/flutter_llama-*/android/.cxx
          rm -rf $GITHUB_WORKSPACE/android/.cxx
          rm -rf $GITHUB_WORKSPACE/build/flutter_llama/intermediates/cxx
          
          echo "🛡️ Step 7: Applying Flutter Official Kotlin Legacy Flags..."
          cd $GITHUB_WORKSPACE
          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            # 根据官方文档，保留 Legacy 模式以兼容未迁移的插件
            grep -qxF "android.builtInKotlin=false" "$GRADLE_PROPS" || echo "android.builtInKotlin=false" >> "$GRADLE_PROPS"
            grep -qxF "android.newDsl=false" "$GRADLE_PROPS" || echo "android.newDsl=false" >> "$GRADLE_PROPS"
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
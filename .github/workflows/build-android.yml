name: Build Flutter Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4

      # 2. 安装 Vulkan 构建工具 (glslc 用于编译着色器, libvulkan-dev 提供 Vulkan 库)
      - name: Install Vulkan build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libvulkan-dev

      # 3. 设置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ★★★ 核心步骤：解除限制 + 绕过 NDK 沙箱 + 编译 Vulkan 依赖 ★★★
      - name: Patch flutter_llama & Prepare Vulkan & Fix Warnings
        run: |
          echo "🔍 Searching for flutter_llama plugin directory..."
          PLUGIN_DIR=$(find $HOME/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          
          if [ -z "$PLUGIN_DIR" ]; then
            PLUGIN_DIR=$(find $HOME/.pub-cache -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$PLUGIN_DIR" ]; then
            echo "❌ Fatal: Could not find flutter_llama plugin directory."
            exit 1
          fi
          
          echo "✅ Plugin directory found: $PLUGIN_DIR"
          cd "$PLUGIN_DIR"
          
          # --- 修复 1: 解除 CMake 3.18.1 限制 ---
          GRADLE_FILE=""
          if [ -f "android/build.gradle.kts" ]; then
            GRADLE_FILE="android/build.gradle.kts"
          elif [ -f "android/build.gradle" ]; then
            GRADLE_FILE="android/build.gradle"
          fi
          
          if [ -n "$GRADLE_FILE" ]; then
            echo "🛠️ Removing CMake 3.18.1 restriction in $GRADLE_FILE..."
            perl -i -ne 'print unless /3\.18\.1/' "$GRADLE_FILE"
          fi
          
          # --- 修复 2: 极速克隆 llama.cpp ---
          rm -rf llama.cpp
          echo "🚀 Shallow cloning llama.cpp..."
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/ggerganov/llama.cpp.git
          
          # --- 修复 3: 手动下载并安装 SPIRV-Headers ---
          echo "🛠️ Downloading and installing SPIRV-Headers locally for Vulkan..."
          rm -rf SPIRV-Headers
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          cd SPIRV-Headers
          # 配置并安装到本地的 install 目录
          cmake -B build -DCMAKE_INSTALL_PREFIX=./install
          cmake --build build --target install
          cd ..
          
          # 获取绝对路径 (关键！)
          SPIRV_INSTALL_DIR=$(pwd)/SPIRV-Headers/install
          echo "✅ SPIRV-Headers installed at absolute path: $SPIRV_INSTALL_DIR"
          
          # --- 修复 4: 注入绝对路径并绕过 NDK sysroot 限制 ---
          CMAKE_FILE="android/src/main/cpp/CMakeLists.txt"
          if [ -f "$CMAKE_FILE" ]; then
            echo "🛠️ Injecting SPIRV-Headers path into $CMAKE_FILE..."
            
            # 创建补丁文件：
            # 1. CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH 是核心！它允许 CMake 在 NDK 交叉编译时查找宿主机路径
            # 2. 注入绝对路径到 CMAKE_PREFIX_PATH 和 SPIRV-Headers_DIR
            cat <<EOF > cmake_patch.txt
# Patch for CI Vulkan build
set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)
list(APPEND CMAKE_PREFIX_PATH "$SPIRV_INSTALL_DIR")
set(SPIRV-Headers_DIR "$SPIRV_INSTALL_DIR")
EOF
            
            # 将补丁安全地插入到 CMakeLists.txt 的最顶部
            cat cmake_patch.txt "$CMAKE_FILE" > temp_cmake.txt
            mv temp_cmake.txt "$CMAKE_FILE"
            rm cmake_patch.txt
            
            echo "✅ Patch injected successfully. NDK sysroot restriction bypassed."
          fi
          
          # --- 修复 5: 消除 Kotlin Gradle Plugin WARNING ---
          cd $GITHUB_WORKSPACE
          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            echo "🛠️ Suppressing Built-in Kotlin warnings in $GRADLE_PROPS..."
            # 确保不重复添加
            grep -qxF "android.builtInKotlin=false" "$GRADLE_PROPS" || echo "android.builtInKotlin=false" >> "$GRADLE_PROPS"
            grep -qxF "android.newDsl=false" "$GRADLE_PROPS" || echo "android.newDsl=false" >> "$GRADLE_PROPS"
            echo "✅ Kotlin warnings suppressed."
          fi

      # 5. 构建 Android APK
      - name: Build Android APK
        run: flutter build apk --release

      # 6. 上传构建产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
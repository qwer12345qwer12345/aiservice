name: Build Flutter Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Configure NDK & CMake Environment
        run: |
          echo "🚀 Pre-installing NDK 27 & CMake 3.22.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          
          # 将 NDK 自带的 glslc (shaderc) 加入 PATH，避免 apt-get 安装
          echo "$ANDROID_HOME/ndk/27.0.12077973/shader-tools/linux-x86_64" >> $GITHUB_PATH
          
          # 清理旧的 CMake 缓存，确保使用最新的 NDK 环境
          rm -rf android/.cxx
          rm -rf $HOME/.pub-cache/hosted/pub.dev/flutter_llama-*/android/.cxx || true

      # 如果你的 flutter_llama 插件确实有 CMake 版本硬编码的 Bug，仅保留 Gradle 替换即可
      - name: Patch Plugin CMake Version
        run: |
          PLUGIN_DIR=$(find $HOME/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "flutter_llama-*" 2>/dev/null | head -n 1)
          if [ -n "$PLUGIN_DIR" ] && [ -f "$PLUGIN_DIR/android/build.gradle" ]; then
            sed -i 's/"3.18.1"/"3.22.1"/g' "$PLUGIN_DIR/android/build.gradle"
            sed -i "s/'3.18.1'/'3.22.1'/g" "$PLUGIN_DIR/android/build.gradle"
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
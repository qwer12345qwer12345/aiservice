name: Build Flutter iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ★★★ 关键修复：提供 llama.cpp 头文件 ★★★
      - name: Fix missing llama.h for flutter_llama
        run: |
          mkdir -p llama.cpp/include
          curl -L -o llama.cpp/include/llama.h https://raw.githubusercontent.com/ggerganov/llama.cpp/master/llama.h
          curl -L -o llama.cpp/include/ggml.h https://raw.githubusercontent.com/ggerganov/llama.cpp/master/ggml.h
          # 如果后续还报错缺少其他头文件，同样方式补充

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS without codesign
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          [ -d "$APP_PATH" ] || APP_PATH="build/ios/Release-iphoneos/Runner.app"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app.ipa
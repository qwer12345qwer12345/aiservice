name: Build Flutter iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # 关键：解决 llama.cpp 缺失问题
      - name: Provide llama.cpp for flutter_llama
        run: |
          if [ ! -d "llama.cpp" ]; then
            echo "Cloning llama.cpp into project root..."
            git clone https://github.com/ggerganov/llama.cpp.git
          else
            echo "llama.cpp already exists"
          fi
          # 验证头文件存在（可选）
          ls -la llama.cpp/include/llama.h || echo "Warning: llama.h not found"

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS without codesign
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          [ -d "$APP_PATH" ] || APP_PATH="build/ios/Release-iphoneos/Runner.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app.ipa
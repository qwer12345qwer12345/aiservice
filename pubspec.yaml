name: aiservice
description: "AI Chat with Branch Tree - 支持分支对话树的 AI 聊天应用"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # ========== 状态管理 ==========
  flutter_riverpod: ^2.4.9

  # ========== 代码生成 ==========
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ========== HTTP 网络请求 ==========
  http: ^1.6.0

  # ========== 本地存储/文件操作 ==========
  path_provider: ^2.1.2
  path: ^1.8.3

  # ========== UUID 生成 ==========
  uuid: ^4.3.3

  # ========== 图片/附件选择 ==========
  image_picker: ^1.0.7

  # ========== 基础 UI 组件 ==========
  cupertino_icons: ^1.0.8

  share_plus: ^10.0.2

  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.0

  collection: ^1.19.1
  rxdart: ^0.28.0
  flutter_localizations:
    sdk: flutter
  file_picker: ^11.0.2
  intl: ^0.20.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ========== 代码生成工具 ==========
  build_runner: ^2.4.8
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0

  # ========== 代码检查 ==========
  flutter_lints: ^6.0.0